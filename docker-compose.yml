# =====================================================================
#  Gestion des rallyes sportifs - environnement complet
# ---------------------------------------------------------------------
#  docker compose up -d   -> démarre PostgreSQL, crée et alimente la base
#                            au premier lancement (service loader)
#  Voir README.md pour toutes les commandes.
#  Les identifiants viennent du fichier .env.
# =====================================================================
name: rallyes

services:

  # -------------------------------------------------------------------
  #  Base de données PostgreSQL
  # -------------------------------------------------------------------
  db:
    image: postgres:17
    container_name: rallye-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"          # accès depuis VS Code, DBeaver, le notebook...
    volumes:
      - rallye-data:/var/lib/postgresql/data   # données persistantes
      - ./sql:/scripts:ro                       # scripts SQL (lecture seule)
      - ./dump:/dump                            # sauvegardes (pg_dump)
    healthcheck:                         # "healthy" quand PostgreSQL accepte les connexions
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  # -------------------------------------------------------------------
  #  Initialisation : crée les tables et alimente la base si elle est
  #  vide, puis s'arrête. Ne touche pas à une base déjà remplie.
  # -------------------------------------------------------------------
  loader:
    build:
      context: .
      dockerfile: loader/Dockerfile
    container_name: rallye-loader
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db                         # nom du service = nom d'hôte sur le réseau Docker
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SQL_DIR: /projet/sql
      FORCE_RELOAD: ${FORCE_RELOAD:-0}
    volumes:
      - ./sql:/projet/sql:ro
      - ./notebooks:/projet/notebooks    # le notebook exécuté est écrit dans notebooks/execution/
    restart: "no"

  # -------------------------------------------------------------------
  #  Application (partie 1.3) : à décommenter quand le dossier app/
  #  contiendra l'application et son Dockerfile.
  # -------------------------------------------------------------------
  # app:
  #   build: ./app
  #   container_name: rallye-app
  #   depends_on:
  #     loader:
  #       condition: service_completed_successfully   # base créée et alimentée
  #   environment:
  #     DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  #   ports:
  #     - "8000:8000"

volumes:
  rallye-data:
