name: rallyes

services:

  db:
    image: postgres:17
    container_name: rallye-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - rallye-data:/var/lib/postgresql/data
      - ./sql:/scripts:ro
      - ./dump:/dump
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  loader:
    build:
      context: .
      dockerfile: loader/Dockerfile
    container_name: rallye-loader
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SQL_DIR: /projet/sql
      FORCE_RELOAD: ${FORCE_RELOAD:-0}
    volumes:
      - ./sql:/projet/sql:ro
      - ./notebooks:/projet/notebooks
    restart: "no"

  # Application (partie 1.3)
  # app:
  #   build: ./app
  #   container_name: rallye-app
  #   depends_on:
  #     loader:
  #       condition: service_completed_successfully
  #   environment:
  #     DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  #   ports:
  #     - "8000:8000"

volumes:
  rallye-data:
